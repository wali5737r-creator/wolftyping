name: typing_master
description: A professional desktop typing learning and testing application (English & Urdu) for Windows.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  get: ^4.6.6

  # Local database
  drift: ^2.16.0
  # Direct dependency (not just via drift): the web connection opens
  # sqlite3 in the main isolate with IndexedDbFileSystem instead of
  # drift's worker path (see database_connection_web.dart).
  sqlite3: ^3.5.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # Simple settings storage
  shared_preferences: ^2.2.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

  # Web-only browser APIs (result-card PNG download). Only imported from
  # the web implementation of the result-share service (conditional
  # import), so desktop builds never touch it.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Drift code generation
  drift_dev: ^2.16.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  # --- Fonts ---------------------------------------------------------
  # Urdu / Arabic-script text: Noto Nastaliq Urdu (variable font,
  # wght 400-700, OFL, from google/fonts). 690 KB — replaces the
  # 10.8 MB Jameel Noori Nastaleeq file, which was too large to ever
  # finish downloading on slow connections, so Urdu never appeared.
  # The .ttf IS in the repo at
  #   assets/fonts/NotoNastaliqUrdu.ttf
  # The variable file is declared once per weight the app uses
  # (400, 500, 600, 700) so each weight is a real instance, not faux-bold.
  fonts:
    - family: Noto Nastaliq Urdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
          weight: 400
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
          weight: 500
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
          weight: 600
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
          weight: 700

    # English / UI font (Inter) is a SEPARATE future task and is deliberately
    # not declared here. Leave it commented until that task:
    #
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

# NOTE:
# This project targets Windows Desktop first.
# After `flutter pub get`, enable desktop support once (per machine) with:
#   flutter config --enable-windows-desktop
# Then generate the windows/ platform folder (only once, not included here
# since it must be generated by the Flutter SDK on your machine):
#   flutter create --platforms=windows .
# Then generate Drift's *.g.dart files:
#   dart run build_runner build --delete-conflicting-outputs
